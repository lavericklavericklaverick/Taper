<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Line Alignment Controller</title>
  
  <!-- Compatible Core + CPU + TFLite Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.10.0/dist/tf-core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-cpu@4.10.0/dist/tf-backend-cpu.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-tflite@0.0.1-alpha.9/dist/tf-tflite.min.js"></script>

  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0; padding: 12px; background: #121212; color: #fff;
      display: flex; flex-direction: column; align-items: center;
    }
    h3 { margin: 8px 0; color: #4da3ff; }
    .version { margin: 0 0 8px; font-size: 12px; color: #888; }
    .viewfinder {
      position: relative; width: 100%; max-width: 320px; aspect-ratio: 1/1;
      border: 2px solid #333; border-radius: 8px; overflow: hidden; background: #000;
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    .reticle {
      position: absolute; top: 15%; left: 15%; width: 70%; height: 70%;
      border: 2px dashed #00ff88; box-sizing: border-box; pointer-events: none;
    }
    .row { display: flex; gap: 8px; margin-top: 10px; width: 100%; max-width: 320px; }
    button {
      flex: 1; padding: 12px 6px; font-size: 14px; font-weight: bold;
      border-radius: 6px; border: none; background: #007bff; color: white;
    }
    button:disabled { background: #444; color: #888; }
    button.manual { background: #ff9800; }
    button.stop { background: #d9534f; }

    .preview-bar {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; max-width: 320px; margin-top: 6px; font-size: 12px; color: #888;
    }
    .model-status {
      width: 100%; max-width: 320px; margin-top: 10px; color: #bbb;
      font-size: 12px; text-align: center;
    }
    .model-progress {
      width: 100%; height: 8px; margin-top: 6px; accent-color: #00c978;
    }
    .alignment-status {
      width: 100%; max-width: 320px; min-height: 18px; margin-top: 8px;
      color: #00ff88; font-size: 13px; font-weight: 600; text-align: center;
    }
    #btnRetryModel {
      margin-top: 8px; padding: 8px 12px; font-size: 12px;
    }
    canvas#cropCanvas {
      width: 48px; height: 48px; border: 1px solid #555; border-radius: 4px;
    }
    
    #console {
      width: 100%; max-width: 320px; height: 160px;
      background: #1c1c1c; border: 1px solid #333; border-radius: 6px;
      font-family: monospace; font-size: 11px; padding: 8px;
      overflow-y: scroll; margin-top: 10px; box-sizing: border-box; color: #00ff66;
    }
    .err { color: #ff5555; }
    .warn { color: #ffcc00; }
  </style>
</head>
<body>

  <h3>Webbing Auto-Aligner</h3>
  <p class="version">Version 2026.09.29.2</p>

  <!-- Camera Live Viewfinder -->
  <div class="viewfinder">
    <video id="webcam" autoplay playsinline muted></video>
    <div class="reticle"></div>
  </div>

  <div class="preview-bar">
    <span>Model View (224x224):</span>
    <canvas id="cropCanvas" width="224" height="224"></canvas>
  </div>

  <div class="model-status" role="status" aria-live="polite">
    <div id="modelStatusText">Preparing model download...</div>
    <progress id="modelProgress" class="model-progress" max="100"></progress>
    <button id="btnRetryModel" hidden>Retry model download</button>
  </div>
  <div id="alignmentStatus" class="alignment-status" role="status" aria-live="polite">
    Start the camera, then tap Check Orientation.
  </div>

  <div class="row">
    <button id="btnStartCam">1. Start Camera</button>
    <button id="btnConnect" disabled>2. Connect BLE</button>
  </div>
  <div class="row">
    <button id="btnStep" class="manual" disabled>Test Step ('R')</button>
    <button id="btnAlign" disabled>Check Orientation</button>
  </div>

  <!-- On-Screen Debug Console -->
  <div id="console"></div>

  <script>
    const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const RX_UUID      = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
    const TX_UUID      = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";
    const MAX_LOG_ENTRIES = 80;

    const logBox = document.getElementById('console');
    function log(msg, cls = "") {
      logBox.insertAdjacentHTML('beforeend', `<div class="${cls}">> ${msg}</div>`);
      while (logBox.childElementCount > MAX_LOG_ENTRIES) {
        logBox.firstElementChild.remove();
      }
      logBox.scrollTop = logBox.scrollHeight;
    }

    window.onerror = (msg, url, line) => log(`Error: ${msg} (line ${line})`, "err");
    window.onunhandledrejection = (e) => log(`Async Error: ${e.reason}`, "err");

    let rxChar = null;
    let tfliteModel = null;
    let isCheckingOrientation = false;
    let waitingForAck = false;
    let ackTimeoutId = null;
    let modelLoadPromise = null;

    const video = document.getElementById('webcam');
    const cropCanvas = document.getElementById('cropCanvas');
    const cropCtx = cropCanvas.getContext('2d');
    const btnStartCam = document.getElementById('btnStartCam');
    const btnConnect = document.getElementById('btnConnect');
    const btnStep = document.getElementById('btnStep');
    const btnAlign = document.getElementById('btnAlign');
    const modelStatusText = document.getElementById('modelStatusText');
    const modelProgress = document.getElementById('modelProgress');
    const btnRetryModel = document.getElementById('btnRetryModel');
    const alignmentStatus = document.getElementById('alignmentStatus');

    function setAlignmentStatus(message) {
      alignmentStatus.textContent = message;
    }

    function updateOrientationButton() {
      btnAlign.disabled = isCheckingOrientation || !tfliteModel || video.videoWidth === 0;
    }

    function updateModelStatus(message, progress = null) {
      modelStatusText.textContent = message;
      if (progress === null) {
        modelProgress.removeAttribute("value");
      } else {
        modelProgress.value = progress;
      }
    }

    // Pre-flight check
    function preFlightCheck() {
      log(`Version: ${document.querySelector('.version').textContent}`);
      log(`Protocol: ${window.location.protocol}`);
      log(`Secure Context: ${window.isSecureContext ? "YES" : "NO"}`);
      log("Ready. Tap '1. Start Camera' to begin.");
    }

    // 1. Start Camera
    btnStartCam.onclick = async () => {
      try {
        log("Requesting rear camera...");
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 640 },
            height: { ideal: 480 }
          },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        log("Camera active.");
        btnStartCam.disabled = true;
        btnConnect.disabled = false;
        updateOrientationButton();

      } catch (err) {
        setAlignmentStatus(`Camera failed: ${err.message}`);
        log(`Camera failed: ${err.message}`, "err");
      }
    };
    video.addEventListener("loadedmetadata", updateOrientationButton);

    // 2. Load TFLite Model
    async function loadModel() {
      if (tfliteModel) return;
      if (modelLoadPromise) return modelLoadPromise;

      btnRetryModel.hidden = true;
      modelLoadPromise = (async () => {
        try {
          updateModelStatus("Preparing TensorFlow Lite runtime...");
          log("Loading TFLite runtime...");
          await tf.ready();
          tflite.setWasmPath('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-tflite@0.0.1-alpha.9/dist/');

          const modelUrl = '/Taper/Orientor/inference/webbing_model.tflite';
          updateModelStatus("Downloading model...");
          log("Downloading webbing_model.tflite...");
          const response = await fetch(modelUrl);
          if (!response.ok) {
            throw new Error(`Model download failed: HTTP ${response.status} ${response.statusText}`);
          }

          const totalBytes = Number(response.headers.get("content-length"));
          let modelBlob;
          if (response.body && response.body.getReader) {
            const reader = response.body.getReader();
            const chunks = [];
            let receivedBytes = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              receivedBytes += value.byteLength;
              if (Number.isFinite(totalBytes) && totalBytes > 0) {
                const percent = Math.min(100, Math.round(receivedBytes / totalBytes * 100));
                updateModelStatus(`Downloading model... ${percent}%`, percent);
              } else {
                updateModelStatus(`Downloading model... ${(receivedBytes / 1024 / 1024).toFixed(1)} MB`);
              }
            }
            modelBlob = new Blob(chunks, { type: "application/octet-stream" });
          } else {
            modelBlob = await response.blob();
            if (Number.isFinite(totalBytes) && totalBytes > 0) {
              updateModelStatus("Downloading model... 100%", 100);
            }
          }

          updateModelStatus("Download complete. Initializing model...");
          const modelObjectUrl = URL.createObjectURL(modelBlob);
          try {
            tfliteModel = await tflite.loadTFLiteModel(modelObjectUrl);
          } finally {
            URL.revokeObjectURL(modelObjectUrl);
          }

          updateModelStatus("Model ready. Start the camera and connect BLE to align.", 100);
          log("<span style='color:#00ff88'>TFLite Model ready!</span>");

          updateOrientationButton();
        } catch (err) {
          updateModelStatus(`Model load failed: ${err.message}`);
          btnRetryModel.hidden = false;
          log(`Model load failed: ${err.message}`, "err");
        } finally {
          modelLoadPromise = null;
        }
      })();
      return modelLoadPromise;
    }

    btnRetryModel.onclick = () => loadModel();

    // 3. Connect Bluetooth
    btnConnect.onclick = async () => {
      try {
        log("Scanning for ESP32C6_Stepper...");
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'ESP32C6_Stepper' }],
          optionalServices: [SERVICE_UUID]
        });

        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        rxChar = await service.getCharacteristic(RX_UUID);
        const txChar = await service.getCharacteristic(TX_UUID);

        await txChar.startNotifications();
        txChar.addEventListener('characteristicvaluechanged', () => {
          if (ackTimeoutId !== null) clearTimeout(ackTimeoutId);
          ackTimeoutId = null;
          waitingForAck = false;
          setAlignmentStatus("Test step finished.");
          log("ESP32 Ack: Step completed.");
        });

        log("<span style='color:#00ff88'>BLE Connected!</span>");
        btnConnect.disabled = true;
        btnStep.disabled = false;
      } catch (err) {
        setAlignmentStatus(`BLE connection failed: ${err.message}`);
        log(`BLE failed: ${err.message}`, "err");
      }
    };

    // 4. Send Step Command
    btnStep.onclick = async () => {
      log("Test Step requested.");
      await sendStep();
    };

    async function sendStep() {
      if (!rxChar) {
        setAlignmentStatus("Step not sent: connect to BLE first.");
        log("Step unavailable: connect to BLE first.", "err");
        return false;
      }
      if (waitingForAck) {
        setAlignmentStatus("Waiting for the previous step to finish.");
        log("Step unavailable: waiting for the previous step to finish.", "warn");
        return false;
      }
      try {
        waitingForAck = true;
        setAlignmentStatus("Sending step command to the motor...");
        const enc = new TextEncoder();
        const command = enc.encode("R");
        if (typeof rxChar.writeValueWithResponse === 'function') {
          await rxChar.writeValueWithResponse(command);
        } else {
          await rxChar.writeValue(command);
        }
        log("Step command sent. Waiting for ESP32 to finish...");
        ackTimeoutId = setTimeout(() => {
          if (waitingForAck) {
            waitingForAck = false;
            ackTimeoutId = null;
            setAlignmentStatus("No step-complete acknowledgement. Check the ESP32 and motor driver.");
            log("No step-complete acknowledgement received. Check the ESP32 firmware and motor driver.", "err");
          }
        }, 5000);
        setAlignmentStatus("Step sent. Waiting for the motor to finish...");
        return true;
      } catch (err) {
        if (ackTimeoutId !== null) clearTimeout(ackTimeoutId);
        ackTimeoutId = null;
        waitingForAck = false;
        setAlignmentStatus(`Step failed: ${err.message}`);
        log(`Step failed: ${err.message}`, "err");
        return false;
      }
    }

    // 5. Report one orientation prediction without moving the motor.
    btnAlign.onclick = async () => {
      if (isCheckingOrientation) return;
      if (video.videoWidth === 0 || !tfliteModel) {
        const missing = [];
        if (video.videoWidth === 0) missing.push("camera");
        if (!tfliteModel) missing.push("model");
        setAlignmentStatus(`Check Orientation needs ${missing.join(" and ")} ready.`);
        return;
      }

      isCheckingOrientation = true;
      updateOrientationButton();
      let inputTensor;
      let output;
      try {
        log(`Checking orientation from ${video.videoWidth}x${video.videoHeight} camera frame.`);
        setAlignmentStatus("Reading camera frame...");
        const minDim = Math.min(video.videoWidth, video.videoHeight);
        const sx = (video.videoWidth - minDim) / 2;
        const sy = (video.videoHeight - minDim) / 2;
        cropCtx.drawImage(video, sx, sy, minDim, minDim, 0, 0, 224, 224);

        const imgData = cropCtx.getImageData(0, 0, 224, 224).data;
        const float32Values = new Float32Array(1 * 224 * 224 * 3);
        let ptr = 0;
        for (let i = 0; i < imgData.length; i += 4) {
          float32Values[ptr++] = imgData[i];
          float32Values[ptr++] = imgData[i + 1];
          float32Values[ptr++] = imgData[i + 2];
        }
        inputTensor = tf.tensor(float32Values, [1, 224, 224, 3], 'float32');

        setAlignmentStatus("Running orientation check...");
        log("Running TFLite orientation prediction.");
        await new Promise(resolve => requestAnimationFrame(resolve));
        const predictionStartedAt = performance.now();
        output = tfliteModel.predict(inputTensor);
        log(`TFLite prediction returned in ${(performance.now() - predictionStartedAt).toFixed(0)} ms.`);

        let outTensor = output;
        if (!(output instanceof tf.Tensor)) {
          const firstKey = Object.keys(output)[0];
          outTensor = output[firstKey];
        }

        if (!outTensor || typeof outTensor.data !== 'function') {
          throw new Error("Model returned no usable output tensor.");
        }

        const rawData = await outTensor.data();
        const raw = rawData[0];
        if (!Number.isFinite(raw) || raw < 0 || raw > 1) {
          throw new Error(`Model returned invalid confidence: ${raw}`);
        }

        const isUp = raw >= 0.5;
        const conf = ((isUp ? raw : (1.0 - raw)) * 100).toFixed(1);
        const orientation = isUp ? "UP" : "DOWN";
        const message = `Model thinks webbing is ${orientation} (${conf}% confidence; raw score: ${raw.toFixed(3)}).`;
        setAlignmentStatus(message);
        log(message);
      } catch (err) {
        setAlignmentStatus(`Orientation check failed: ${err.message}`);
        log(`Orientation check failed: ${err.name}: ${err.message}`, "err");
      } finally {
        if (inputTensor) inputTensor.dispose();
        if (output instanceof tf.Tensor) {
          output.dispose();
        } else if (output) {
          for (const tensor of Object.values(output)) {
            if (tensor && typeof tensor.dispose === 'function') tensor.dispose();
          }
        }
        isCheckingOrientation = false;
        updateOrientationButton();
      }
    };

    preFlightCheck();
    loadModel();
  </script>
</body>
</html>
